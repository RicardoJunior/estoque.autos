# Sync mensal da FIPE (rápido, ~30 min) — dia 1 de cada mês, quando
# a tabela nova sai: renova o catálogo (marcas + modelos, podando
# removidos), o preço dos códigos em uso e o snapshot dos veículos.
# A TABELA COMPLETA do mês fica com o workflow fipe-full-import
# (janelas com resume nos dias 1-2).
# Secrets necessários no repo: SUPABASE_URL, SUPABASE_SECRET_KEY.
name: fipe-sync

on:
  schedule:
    # dia 1 de cada mês, 07:30 UTC (04:30 BRT) — antes das janelas
    # do full-import; se a FIPE publicar atrasado, o full-import do
    # dia 2 cobre
    - cron: "30 7 1 * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/fipe-sync.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

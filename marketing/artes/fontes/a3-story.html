<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="base.css" />
<style>
  .art { padding: 84px 84px 80px; align-items: center; text-align: center; }
  .logo { font-size: 32px; }
  .h1 { font-size: 116px; margin-top: 44px; }
  .steps { display: flex; flex-direction: column; gap: 20px; margin-top: 52px; width: 100%; text-align: left; }
  .step { display: flex; align-items: center; gap: 24px; background: var(--card); border: 1.5px solid var(--line); border-radius: 22px; padding: 24px 32px; }
  .step .n { font-family: "Anton", sans-serif; font-size: 40px; color: var(--amber); width: 60px; }
  .step .t { font-size: 31px; font-weight: 600; }
  .step .d { font-size: 24px; color: var(--muted); margin-top: 3px; }
  .phone { width: 330px; margin-top: 52px; }
  .price-row { display: flex; align-items: baseline; gap: 14px; margin-top: 50px; }
  .price-row .lbl { font-size: 28px; color: var(--muted); }
  .price-row .val { font-family: "Anton", sans-serif; font-size: 58px; }
  .price-row .per { font-size: 30px; color: var(--muted); }
  .cta { padding: 28px 56px; font-size: 36px; margin-top: 32px; }
</style>
</head>
<body>
<div class="art st">
  <div class="glow" style="width:820px;height:820px;left:50%;top:-380px;transform:translateX(-50%)"></div>
  <div class="glow" style="width:600px;height:600px;left:-260px;bottom:520px;opacity:.28"></div>

  <span class="logo">
    <svg width="44" height="44" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#ff7a1a"/><path d="M9.5 10 15 16l-5.5 6M16 10l5.5 6L16 22" stroke="#160a02" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="word">estoque<i>.autos</i></span>
  </span>

  <div class="h h1">
    <span>Sua loja</span>
    <span class="am">no ar</span>
    <span>ainda hoje.</span>
  </div>

  <div class="steps">
    <div class="step">
      <span class="n">01</span>
      <span><span class="t">Crie a conta</span><br /><span class="d">Sem código, sem agência, sem setup</span></span>
    </div>
    <div class="step">
      <span class="n">02</span>
      <span><span class="t">Cadastre pela tabela FIPE</span><br /><span class="d">Marca, modelo, ano — o preço de tabela já vem junto</span></span>
    </div>
    <div class="step">
      <span class="n">03</span>
      <span><span class="t">Receba leads no WhatsApp</span><br /><span class="d">Cada clique vira um lead registrado no painel</span></span>
    </div>
  </div>

  <div class="phone">
    <span class="screen"><img src="shot-premium-mobile.png" alt="" /></span>
  </div>

  <div class="price-row">
    <span class="lbl">planos a partir de</span>
    <span class="val">R$ 24,90</span>
    <span class="per">/mês</span>
  </div>
  <span class="cta">Criar meu site →</span>
</div>
</body>
</html>

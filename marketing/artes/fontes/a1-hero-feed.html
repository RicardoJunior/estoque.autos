<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="base.css" />
<style>
  .art { padding: 64px 72px; }
  .col { position: relative; z-index: 2; width: 590px; display: flex; flex-direction: column; align-items: flex-start; gap: 38px; height: 100%; }
  .h1 { font-size: 102px; }
  .feat { display: flex; flex-direction: column; gap: 18px; font-size: 31px; color: var(--muted); }
  .feat b { color: var(--ink); font-weight: 600; }
  .price { padding: 22px 30px; }
  .price .lbl { font-size: 24px; color: var(--muted); }
  .price .val { font-family: "Anton", sans-serif; font-size: 44px; color: var(--ink); }
  .price .per { font-size: 26px; color: var(--muted); }
  .cta { padding: 26px 46px; font-size: 34px; }
  .foot { margin-top: auto; }
  .logo { font-size: 34px; }
  .phone { position: absolute; right: -18px; top: 130px; width: 430px; transform: rotate(-3.5deg); z-index: 1; }
</style>
</head>
<body>
<div class="art sq">
  <div class="glow" style="width:700px;height:700px;right:-220px;top:-260px"></div>
  <div class="glow" style="width:500px;height:500px;left:-240px;bottom:-240px;opacity:.3"></div>

  <div class="col">
    <span class="eyebrow"><span class="dot"></span> Para lojas de veículos</span>
    <div class="h h1">
      <span>O site da sua</span>
      <span>loja de carros,</span>
      <span class="am">pronto em</span>
      <span class="am">minutos.</span>
    </div>
    <div class="feat">
      <span><b class="check">✓</b> <b>6 templates</b> com sua cor e seu logo</span>
      <span><b class="check">✓</b> Cadastro puxando a <b>tabela FIPE</b></span>
      <span><b class="check">✓</b> Leads direto no seu <b>WhatsApp</b></span>
    </div>
    <div class="chip price">
      <span class="lbl">a partir de</span>
      <span class="val">R$ 24,90</span>
      <span class="per">/mês</span>
    </div>
    <div class="foot logo">
      <svg width="40" height="40" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#ff7a1a"/><path d="M9.5 10 15 16l-5.5 6M16 10l5.5 6L16 22" stroke="#160a02" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="word">estoque<i>.autos</i></span>
    </div>
  </div>

  <div class="phone">
    <span class="screen"><img src="shot-premium-mobile.png" alt="" /></span>
  </div>
</div>
</body>
</html>

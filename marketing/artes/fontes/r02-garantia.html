<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="base.css" />
<style>
  .art { padding: 72px; }
  .col { position: relative; z-index: 2; width: 600px; display: flex; flex-direction: column; align-items: flex-start; gap: 40px; height: 100%; }
  .h1 { font-size: 108px; }
  .seal { display: inline-flex; align-items: center; gap: 18px; background: linear-gradient(135deg, rgba(255, 122, 26, 0.16), rgba(255, 122, 26, 0.05)); border: 2px solid rgba(255, 122, 26, 0.55); border-radius: 24px; padding: 28px 36px; }
  .seal .n { font-family: "Anton", sans-serif; font-size: 64px; color: var(--amber); }
  .seal .t { font-size: 30px; font-weight: 700; line-height: 1.2; }
  .seal .t small { display: block; font-size: 25px; color: var(--muted); font-weight: 400; margin-top: 4px; }
  .sub { font-size: 31px; }
  .cta { padding: 26px 46px; font-size: 33px; }
  .foot { margin-top: auto; }
  .logo { font-size: 32px; }
  .phone { position: absolute; right: -18px; top: 150px; width: 420px; transform: rotate(-3.5deg); z-index: 1; }
</style>
</head>
<body>
<div class="art sq">
  <div class="glow" style="width:700px;height:700px;right:-220px;top:-260px"></div>

  <div class="col">
    <span class="eyebrow"><span class="dot"></span> Sem risco</span>
    <div class="h h1">
      <span>Teste</span>
      <span>sem medo.</span>
    </div>
    <div class="seal">
      <span class="n">7</span>
      <span class="t">dias de garantia<small>Não gostou? Devolvemos. Sem pergunta.</small></span>
    </div>
    <p class="sub">Crie sua loja hoje, cadastre o estoque, receba leads. Se não fizer sentido, <strong>o risco é nosso</strong>.</p>
    <span class="cta">Criar meu site →</span>
    <div class="foot logo">
      <svg width="40" height="40" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#ff7a1a"/><path d="M9.5 10 15 16l-5.5 6M16 10l5.5 6L16 22" stroke="#160a02" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="word">estoque<i>.autos</i></span>
    </div>
  </div>

  <div class="phone">
    <span class="screen"><img src="shot-premium-mobile.png" alt="" /></span>
  </div>
</div>
</body>
</html>

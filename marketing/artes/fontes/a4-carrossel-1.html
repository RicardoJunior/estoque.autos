<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="base.css" />
<style>
  .art { padding: 84px; align-items: flex-start; }
  .compare { display: flex; flex-direction: column; gap: 26px; width: 100%; margin-top: 64px; }
  .cmp { border-radius: 26px; padding: 44px 48px; }
  .cmp .lbl { font-size: 28px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; }
  .cmp .big { font-family: "Anton", sans-serif; font-size: 92px; margin-top: 10px; }
  .cmp .note { font-size: 27px; margin-top: 10px; }
  .portal { background: var(--card); border: 1.5px solid var(--line); }
  .portal .lbl, .portal .note { color: var(--muted); }
  .portal .big { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 6px; text-decoration-color: rgba(255, 122, 26, 0.75); }
  .nosso { background: linear-gradient(135deg, rgba(255, 122, 26, 0.16), rgba(255, 122, 26, 0.05)); border: 2px solid rgba(255, 122, 26, 0.55); box-shadow: 0 24px 90px rgba(255, 122, 26, 0.16); }
  .nosso .lbl { color: var(--amber); }
  .nosso .note { color: var(--muted); }
  .nosso .note strong { color: var(--ink); }
  .foot { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: auto; }
  .logo { font-size: 30px; }
  .swipe { font-size: 30px; color: var(--muted); font-weight: 600; }
  .swipe i { font-style: normal; color: var(--amber); }
  .h1 { font-size: 84px; }
</style>
</head>
<body>
<div class="art sq">
  <div class="glow" style="width:620px;height:620px;right:-260px;bottom:-240px"></div>

  <div class="h h1">
    <span>Quanto custa</span>
    <span>ter site próprio?</span>
  </div>

  <div class="compare">
    <div class="cmp portal">
      <span class="lbl">1 lead avulso em portal</span>
      <div class="big">~R$ 24</div>
      <div class="note">por lead — dividido com a concorrência, além da mensalidade</div>
    </div>
    <div class="cmp nosso">
      <span class="lbl">estoque.autos — o site inteiro</span>
      <div class="big">R$ 24,90<span style="font-size:44px">/mês</span></div>
      <div class="note"><strong>Leads ilimitados no seu WhatsApp.</strong> Sem taxa de setup · cancele quando quiser</div>
    </div>
  </div>

  <div class="foot">
    <span class="logo">
      <svg width="36" height="36" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#ff7a1a"/><path d="M9.5 10 15 16l-5.5 6M16 10l5.5 6L16 22" stroke="#160a02" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="word">estoque<i>.autos</i></span>
    </span>
    <span class="swipe">arraste <i>→</i></span>
  </div>
</div>
</body>
</html>

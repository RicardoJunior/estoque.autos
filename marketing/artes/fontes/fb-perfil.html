<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<style>
  /* Foto de perfil da página do Facebook — 540x540 @2x = 1080x1080.
     O Facebook recorta em CÍRCULO: a marca fica na safe-zone central (~62%),
     mesma regra do ícone maskable do app (scripts/gen-favicons.mjs). */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #ff7a1a; }
  .avatar { width: 540px; height: 540px; background: #ff7a1a; display: grid; place-items: center; }
  svg { width: 348px; height: 348px; display: block; }
</style>
</head>
<body>
<div class="avatar">
  <svg viewBox="0 0 32 32" fill="none">
    <g transform="translate(0.5 0)">
      <path d="M9.5 10 15 16l-5.5 6M16 10l5.5 6L16 22" stroke="#160a02" stroke-width="2.6"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </svg>
</div>
</body>
</html>
